services:
  - type: web
    name: hi-events
    runtime: docker
    plan: free
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: APP_DEBUG
        value: "false"
      - key: APP_ENV
        value: "production"
      - key: LOG_CHANNEL
        value: "stack"
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: MAIL_MAILER
        value: "log"
      - key: REDIS_URL
        fromService:
          name: redis
          property: connectionString
    routes:
      - path: /
        matchType: prefix

databases:
  - name: postgres
    plan: free
    version: "15"

  - name: redis
    plan: free
    version: "7"
