services:
  - type: web
    name: hi-events
    runtime: docker
    dockerfilePath: ./Dockerfile.all-in-one
    buildCommand: docker build -f Dockerfile.all-in-one -t hi-events:latest .
    startCommand: /app/scripts/startup.sh
    plan: free
    numInstances: 1
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: APP_DEBUG
        value: "false"
      - key: APP_ENV
        value: "production"
      - key: LOG_CHANNEL
        value: "stack"
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: MAIL_MAILER
        value: "log"
      - key: REDIS_URL
        fromService:
          name: redis
          property: connectionString
    routes:
      - path: /
        matchType: prefix

  - type: pserv
    name: postgres
    runtime: postgres15
    plan: free
    ipAllowList: []

  - type: redis
    name: redis
    plan: free
    ipAllowList: []
