services:
  - type: web
    name: hi-events
    runtime: docker
    plan: free
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: APP_DEBUG
        value: "false"
      - key: APP_ENV
        value: "production"
      - key: LOG_CHANNEL
        value: "stack"
      - key: MAIL_MAILER
        value: "log"
      - key: DB_CONNECTION
        value: "pgsql"
      - key: DB_HOST
        fromDatabase:
          name: postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: postgres
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: postgres
          property: password
      - key: REDIS_HOST
        fromService:
          name: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: redis
          property: port

databases:
  - name: postgres
    plan: free
    version: "15"

  - name: redis
    plan: free
