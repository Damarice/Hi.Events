events {}

http {
   upstream php_backend {
       server 127.0.0.1:9000;
       keepalive 32;
   }

   upstream frontend_ssr {
       server 127.0.0.1:5678;
       keepalive 32;
   }

   # Upstream health status
   map $upstream_addr $backend_name {
       '127.0.0.1:9000' 'PHP-FPM';
       '127.0.0.1:5678' 'Frontend-SSR';
   }

   server {
       listen 80 default_server;
       listen [::]:80 default_server;
       server_name _;

       root /app/backend/public;
       index index.html index.htm index.php;
       charset utf-8;

       access_log /dev/stdout;
       error_log /dev/stderr warn;

       add_header X-XSS-Protection "1; mode=block";
       add_header X-Upstream-Server $backend_name always;

       # == PRIORITY 1: Storage files (Laravel storage) ==
       location /storage {
           alias /app/backend/storage/app/public;
           access_log off;
           expires max;
           add_header Cache-Control "public, immutable";
       }

       # == PRIORITY 2: Static assets (CSS, JS, images, fonts) ==
       location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|ico|webp|map)$ {
           root /app/frontend/dist/client;
           access_log off;
           expires 1y;
           add_header Cache-Control "public, immutable";
           add_header Vary "Accept-Encoding";
           try_files $uri =404;
       }

       # == PRIORITY 3: Manifest and JSON files ==
       location ~* \.json$ {
           root /app/frontend/dist/client;
           access_log off;
           expires 1h;
           add_header Cache-Control "public, max-age=3600";
           try_files $uri @frontend_ssr;
       }

       # == PRIORITY 4: API Routes (Laravel) ==
       location /api/ {
           # Direct to PHP-FPM, bypass try_files for performance
           include fastcgi_params;
           fastcgi_param SCRIPT_FILENAME $document_root/index.php;
           fastcgi_param SCRIPT_NAME /index.php;
           fastcgi_param REQUEST_URI $request_uri;
           fastcgi_param PATH_INFO $fastcgi_path_info;
           fastcgi_pass php_backend;
           fastcgi_keep_conn on;
           client_max_body_size 20M;
           
           # Error handling
           error_page 502 503 504 /api-error.html;
           access_log /dev/stdout;
       }

       # == PRIORITY 5: Direct .php file requests ==
       location ~ \.php$ {
           include fastcgi_params;
           fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
           fastcgi_split_path_info ^(.+\.php)(/.+)$;
           fastcgi_pass php_backend;
           fastcgi_index index.php;
           fastcgi_keep_conn on;
           client_max_body_size 20M;
       }

       # == PRIORITY 6: Deny access to hidden files ==
       location ~ /\. {
           deny all;
           access_log off;
           log_not_found off;
       }

       # == PRIORITY 7: Favicon and robots ==
       location = /favicon.ico {
           access_log off;
           log_not_found off;
           try_files $uri =204;
       }

       location = /robots.txt {
           access_log off;
           log_not_found off;
       }

       # == PRIORITY 8: Frontend SSR (everything else) ==
       location / {
           proxy_pass http://frontend_ssr;
           proxy_http_version 1.1;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_set_header Connection "";
           proxy_read_timeout 60s;
           proxy_connect_timeout 10s;
           proxy_buffering off;
       }

       # Named location for SSR fallback
       location @frontend_ssr {
           proxy_pass http://frontend_ssr;
           proxy_http_version 1.1;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
       }
   }
}
