events {}

http {
   upstream php_backend {
       server localhost:9000;
   }

   upstream frontend_ssr {
       server localhost:5678;
   }

   server {
       listen 80;
       listen [::]:80;
       server_name _;

       root /app/backend/public;

       add_header X-XSS-Protection "1; mode=block";

       index index.html index.htm index.php;
       charset utf-8;

       access_log /dev/stdout;
       error_log /dev/stderr;

       # Storage files - static assets
       location /storage {
           alias /app/backend/storage/app/public;
           access_log off;
           expires max;
           add_header Cache-Control "public";
       }

       # Frontend static assets from dist/client (CSS, JS, images, fonts, etc)
       location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|ico|webp)$ {
           try_files $uri @frontend_ssr;
           access_log off;
           expires 1y;
           add_header Cache-Control "public, immutable";
           add_header Vary "Accept-Encoding";
       }

       # Frontend manifest and other JSON files
       location ~* \.json$ {
           try_files $uri @frontend_ssr;
           access_log off;
           expires 1h;
           add_header Cache-Control "public, max-age=3600";
       }

       # API routes - all go to Laravel backend
       location ~* ^/api(/|$) {
           try_files $uri $uri/ /index.php$is_args$args;
           include fastcgi_params;
           fastcgi_param SCRIPT_FILENAME $document_root/index.php;
           fastcgi_param SCRIPT_NAME /index.php;
           fastcgi_param REQUEST_URI $request_uri;
           fastcgi_pass php_backend;
           client_max_body_size 20M;
       }

       # Direct PHP file requests
       location ~ \.php$ {
           try_files $uri =404;
           include fastcgi_params;
           fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
           fastcgi_split_path_info ^(.+\.php)(/.+)$;
           fastcgi_pass php_backend;
           fastcgi_index index.php;
           fastcgi_param PHP_VALUE "error_log=/dev/stderr";
       }

       # Deny access to hidden files
       location ~ /\.(?!well-known).* {
           deny all;
       }

       location = /favicon.ico { 
           access_log off; 
           log_not_found off;
           try_files $uri =204;
       }

       location = /robots.txt  { 
           access_log off; 
           log_not_found off;
       }

       # Everything else goes to frontend SSR
       location / {
           proxy_pass http://frontend_ssr;
           proxy_http_version 1.1;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_set_header Connection "upgrade";
           proxy_read_timeout 60s;
       }

       # Named location for fallback to SSR when static file not found
       location @frontend_ssr {
           proxy_pass http://frontend_ssr;
           proxy_http_version 1.1;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
       }
   }
}
